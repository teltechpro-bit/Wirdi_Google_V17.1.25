name: Verify added Quran reciter editions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/core/data/reciters.dart'
      - '.github/workflows/verify-new-reciter-editions.yml'

permissions:
  contents: read

jobs:
  verify-editions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check edition metadata and representative ayah audio URLs
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          editions = {
              "ar.sudais": "عبد الرحمن السديس",
              "ar.shuraim": "سعود الشريم",
              "ar.abdulbasit": "عبد الباسط عبد الصمد",
              "ar.muhammadayoub": "محمد أيوب",
          }
          sample_ayahs = [(1, 1), (2, 255), (19, 1), (112, 1), (114, 6)]

          def get_json(url):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Wirdi-reciter-edition-verifier/1.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}: {url}")
                  return json.loads(response.read().decode("utf-8"))

          def check_audio(url):
              if not isinstance(url, str) or not url.startswith("https://"):
                  raise RuntimeError(f"Missing or non-HTTPS audio URL: {url!r}")
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Wirdi-reciter-edition-verifier/1.0",
                      "Range": "bytes=0-0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status not in (200, 206):
                          raise RuntimeError(f"Audio HTTP {response.status}: {url}")
                      if response.status == 200:
                          # Some CDNs ignore Range and return the whole MP3. Close immediately.
                          response.close()
                      return response.status
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f"Audio HTTP {exc.code}: {url}") from exc

          failures = []
          for edition_id, expected_name in editions.items():
              print(f"\n== {edition_id} ==")
              try:
                  metadata = get_json(f"https://api.alquran.cloud/v1/edition/{edition_id}")
                  edition = metadata.get("data")
                  if not isinstance(edition, dict):
                      raise RuntimeError(f"Unexpected edition metadata: {metadata!r}")
                  if edition.get("identifier") != edition_id:
                      raise RuntimeError(f"Identifier mismatch: {edition.get('identifier')!r}")
                  if edition.get("format") != "audio":
                      raise RuntimeError(f"Expected audio edition, got {edition.get('format')!r}")
                  if edition.get("language") != "ar":
                      raise RuntimeError(f"Expected Arabic edition, got {edition.get('language')!r}")
                  print(f"Metadata OK: {edition.get('name')} ({edition.get('language')}/{edition.get('format')})")

                  for surah, ayah in sample_ayahs:
                      payload = get_json(
                          f"https://api.alquran.cloud/v1/ayah/{surah}:{ayah}/{edition_id}"
                      )
                      data = payload.get("data")
                      if not isinstance(data, dict):
                          raise RuntimeError(f"No ayah metadata for {surah}:{ayah}")
                      if data.get("numberInSurah") != ayah or data.get("surah", {}).get("number") != surah:
                          raise RuntimeError(f"Wrong ayah returned for {surah}:{ayah}: {data!r}")
                      audio_url = data.get("audio")
                      status = check_audio(audio_url)
                      print(f"OK {surah}:{ayah} audio HTTP {status}")
                      time.sleep(0.15)
              except Exception as exc:
                  failures.append(f"{edition_id}: {exc}")
                  print(f"FAIL: {exc}", file=sys.stderr)

          print("\n== Summary ==")
          if failures:
              for failure in failures:
                  print(f"FAILED: {failure}", file=sys.stderr)
              sys.exit(1)
          print(f"PASS: all {len(editions)} editions and {len(editions) * len(sample_ayahs)} representative ayah audio URLs verified.")
          print("Note: this network probe does not test in-app playback or synchronized verse highlighting.")
          PY

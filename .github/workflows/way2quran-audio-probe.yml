name: Way2Quran Audio URL Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  probe-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check API payload and one real audio URL
        shell: bash
        run: |
          python - <<'PY'
          import json
          import requests

          base = "https://way2quran.com/api"
          session = requests.Session()
          session.headers["User-Agent"] = "Wirdi-Audio-Connectivity-Probe/1.0"

          def get_json(url):
              r = session.get(url, timeout=20)
              print(f"GET {url} -> HTTP {r.status_code}; content-type={r.headers.get('content-type')}; bytes={len(r.content)}")
              r.raise_for_status()
              payload = r.json()
              return payload.get("data", payload) if isinstance(payload, dict) else payload

          reciters = get_json(base + "/reciters?pageSize=1&currentPage=1")
          if isinstance(reciters, dict):
              reciters = reciters.get("reciters", [])
          if not reciters:
              raise SystemExit("API responded, but no reciter record was found in the expected payload.")
          slug = reciters[0].get("slug")
          if not slug:
              raise SystemExit("First reciter record has no slug; cannot resolve its profile.")
          profile = get_json(base + "/reciters/reciter-profile/" + slug + "?increaseViews=false")
          if isinstance(profile, dict) and isinstance(profile.get("reciter"), dict):
              profile = profile["reciter"]

          urls = []
          def walk(value):
              if isinstance(value, dict):
                  for k, v in value.items():
                      if isinstance(v, str) and v.startswith("http") and (".mp3" in v.lower() or "audio" in k.lower() or "download" in k.lower()):
                          urls.append(v)
                      else:
                          walk(v)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
          walk(profile)
          urls = list(dict.fromkeys(urls))
          if not urls:
              print("Profile keys:", list(profile.keys()) if isinstance(profile, dict) else type(profile).__name__)
              raise SystemExit("Profile responded but no candidate audio/download URL was exposed in its payload.")
          print("Candidate audio URLs:", len(urls))
          last_error = None
          for url in urls[:5]:
              try:
                  r = session.get(url, headers={"Range": "bytes=0-1"}, stream=True, timeout=20, allow_redirects=True)
                  print(f"AUDIO GET Range {url} -> HTTP {r.status_code}; content-type={r.headers.get('content-type')}; content-length={r.headers.get('content-length')}; final-url={r.url}")
                  r.close()
                  if r.status_code in (200, 206) and ("audio" in r.headers.get("content-type", "").lower() or ".mp3" in r.url.lower() or "octet-stream" in r.headers.get("content-type", "").lower()):
                      print("AUDIO_URL_CHECK=PASS")
                      break
              except Exception as e:
                  last_error = e
                  print(f"AUDIO_URL_ERROR {type(e).__name__}: {e}")
          else:
              raise SystemExit(f"No candidate audio URL passed the HTTP range/content-type check. Last error: {last_error}")
          PY

      - name: Probe all requested Quran radio streams (audio bytes or playable HLS segment)
        shell: bash
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import requests

          urls = {
            "Egypt - Way2Quran": "https://way2quran.com/api/external-radio/stream/egypt-holy-quran-radio",
            "Saudi Arabia - Way2Quran": "https://way2quran.com/api/external-radio/stream/holy-quran-from-saudia-arabia",
            "Kuwait - Way2Quran": "https://way2quran.com/api/external-radio/stream/kuwait-quran",
            "Pakistan - Way2Quran": "https://way2quran.com/api/external-radio/stream/pakistan-quran",
            "Palestine - Way2Quran": "https://way2quran.com/api/external-radio/stream/palestine-quran",
            "Sharjah - Way2Quran": "https://way2quran.com/api/external-radio/stream/uae-sharjah-quran",
            "Main Radio - Way2Quran": "https://way2quran.com/api/external-radio/stream/main-radio",
            "Beautiful Recitations - Way2Quran": "https://way2quran.com/api/external-radio/stream/beautiful-recitations",
            "Short Recitations - Way2Quran": "https://way2quran.com/api/external-radio/stream/amazing-short-recitations",
            "Verses of Serenity - Way2Quran": "https://way2quran.com/api/external-radio/stream/verses-of-serenity",
            "Tafsir Summary - Way2Quran": "https://way2quran.com/api/external-radio/stream/a-summary-of-the-interpretation-of-the-holy-quran",
            "Tafsir Tabari - Way2Quran": "https://way2quran.com/api/external-radio/stream/interpretation-of-the-holy-qur-an-conclusion-from-tafsir-al-tabari",
            "MP3Quran - Way2Quran": "https://way2quran.com/api/external-radio/stream/mp3quran-109076",
            "Bahrain HLS": "https://5c7b683162943.streamlock.net/live/ngrp:radio-106-1_all/playlist.m3u8",
            "Jordan HLS": "https://jrtv-live.ercdn.net/jrradio/quranradio.m3u8",
            "Oman HLS": "https://partwota.cdn.mgmlcdn.com/quranrdoorg/quranrdo.stream_aac/chunklist.m3u8",
          }
          session = requests.Session()
          session.headers["User-Agent"] = "Wirdi-Quran-Radio-Probe/1.0"
          failed = []
          for name, url in urls.items():
            try:
              r = session.get(url, timeout=18, stream=True, allow_redirects=True)
              ctype = r.headers.get("content-type", "").lower()
              first = next(r.iter_content(chunk_size=512), b"")
              status = r.status_code
              final_url = r.url
              print(f"[{name}] status={status} type={ctype} first_bytes={len(first)} final={final_url}")
              if status not in (200, 206) or not first:
                failed.append(name + ": no stream bytes")
                r.close()
                continue
              is_hls = (".m3u8" in final_url.lower() or "mpegurl" in ctype or first.lstrip().startswith(b"#EXTM3U"))
              if is_hls:
                r.close()
                playlist = session.get(final_url, timeout=18)
                if playlist.status_code != 200 or "#EXTM3U" not in playlist.text:
                  failed.append(name + ": invalid HLS playlist")
                  continue
                segment = next((line.strip() for line in playlist.text.splitlines()
                                if line.strip() and not line.strip().startswith("#")), None)
                if not segment:
                  failed.append(name + ": HLS playlist has no media segment")
                  continue
                segment_url = urljoin(playlist.url, segment)
                sr = session.get(segment_url, headers={"Range": "bytes=0-1023"},
                                 timeout=18, stream=True, allow_redirects=True)
                chunk = next(sr.iter_content(chunk_size=1024), b"")
                print(f"[{name}] segment status={sr.status_code} type={sr.headers.get('content-type')} bytes={len(chunk)}")
                if sr.status_code not in (200, 206) or not chunk:
                  failed.append(name + ": HLS media segment not playable")
                sr.close()
              else:
                audio_type = any(x in ctype for x in ("audio/", "octet-stream", "application/aac", "application/mp4"))
                audio_signature = first.startswith(b"ID3") or (len(first) > 1 and first[0] == 0xFF and (first[1] & 0xE0) == 0xE0)
                if not (audio_type or audio_signature or ".mp3" in final_url.lower() or ".aac" in final_url.lower()):
                  failed.append(name + ": response is not recognisable audio")
                r.close()
            except Exception as exc:
              failed.append(name + ": " + type(exc).__name__ + ": " + str(exc))
          print(f"RADIO_STREAM_PROBE: {len(urls)-len(failed)}/{len(urls)} passed")
          if failed:
            print("FAILED STREAMS (must remain disabled until corrected):")
            for item in failed:
              print(" - " + item)
            raise SystemExit(1)
          PY

name: Firestore Rules Emulator Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'test/firestore.rules.test.mjs'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'test/firestore.rules.test.mjs'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Test Firestore rules in emulator
        run: npm run test:rules

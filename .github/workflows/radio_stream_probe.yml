name: Quran Radio Stream Probe
on:
  pull_request:
    paths:
      - '.github/workflows/radio_stream_probe.yml'
      - 'lib/core/data/radio_stations.dart'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify stream payloads (not just HTTP status)
        shell: python
        run: |
          import urllib.request, urllib.parse, re, sys

          stations = [
            ("Egypt", "https://way2quran.com/api/external-radio/stream/egypt-holy-quran-radio"),
            ("Saudi Arabia", "https://way2quran.com/api/external-radio/stream/holy-quran-from-saudia-arabia"),
            ("Kuwait", "https://way2quran.com/api/external-radio/stream/kuwait-quran"),
            ("Pakistan", "https://way2quran.com/api/external-radio/stream/pakistan-quran"),
            ("Palestine", "https://way2quran.com/api/external-radio/stream/palestine-quran"),
            ("Sharjah", "https://way2quran.com/api/external-radio/stream/uae-sharjah-quran"),
            ("Main radio", "https://way2quran.com/api/external-radio/stream/main-radio"),
            ("Beautiful recitations", "https://way2quran.com/api/external-radio/stream/beautiful-recitations"),
            ("Short recitations", "https://way2quran.com/api/external-radio/stream/amazing-short-recitations"),
            ("Verses of serenity", "https://way2quran.com/api/external-radio/stream/verses-of-serenity"),
            ("Quran tafsir summary", "https://way2quran.com/api/external-radio/stream/a-summary-of-the-interpretation-of-the-holy-quran"),
            ("Tafsir al-Tabari summary", "https://way2quran.com/api/external-radio/stream/interpretation-of-the-holy-qur-an-conclusion-from-tafsir-al-tabari"),
            ("MP3Quran", "https://way2quran.com/api/external-radio/stream/mp3quran-109076"),
            ("Bahrain", "https://5c7b683162943.streamlock.net/live/ngrp:radio-106-1_all/playlist.m3u8"),
            ("Jordan", "https://jrtv-live.ercdn.net/jrradio/quranradio.m3u8"),
            ("Oman", "https://partwota.cdn.mgmlcdn.com/quranrdoorg/quranrdo.stream_aac/chunklist.m3u8"),
          ]

          def read(url, limit=8192):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "WirdiRadioProbe/1.0",
                  "Range": "bytes=0-8191",
                  "Accept": "*/*",
              })
              with urllib.request.urlopen(req, timeout=18) as response:
                  status = response.status
                  final_url = response.geturl()
                  ctype = response.headers.get("Content-Type", "").lower()
                  data = response.read(limit)
              return status, final_url, ctype, data

          failures = 0
          for name, url in stations:
              try:
                  status, final_url, ctype, data = read(url)
                  if not (200 <= status < 300):
                      raise RuntimeError("HTTP " + str(status))
                  if not data or data.lstrip().lower().startswith((b"<!doctype html", b"<html")):
                      raise RuntimeError("empty or HTML response, not audio/playlist")
                  is_playlist = b"#EXTM3U" in data[:1024]
                  if is_playlist:
                      lines = data.decode("utf-8", "replace").splitlines()
                      segment = next((line.strip() for line in lines if line.strip() and not line.startswith("#")), None)
                      if not segment:
                          raise RuntimeError("HLS playlist has no media segment")
                      segment_url = urllib.parse.urljoin(final_url, segment)
                      s2, final2, ct2, body2 = read(segment_url, 4096)
                      if not (200 <= s2 < 300) or len(body2) < 64 or body2.lstrip().lower().startswith(b"<html"):
                          raise RuntimeError("HLS media segment failed payload check")
                      print("PASS | " + name + " | HTTP " + str(status) + " | HLS playlist + segment bytes | " + final_url)
                  elif len(data) >= 64 and not (ctype.startswith("text/html") or b"<html" in data[:512].lower()):
                      print("PASS | " + name + " | HTTP " + str(status) + " | audio-like payload " + ctype + " | " + final_url)
                  else:
                      raise RuntimeError("response is not a recognizable audio payload (" + ctype + ")")
              except Exception as e:
                  failures += 1
                  print("FAIL | " + name + " | " + str(e))
          print("\nProbe summary: " + str(len(stations)-failures) + "/" + str(len(stations)) + " sources passed payload checks.")
          # Keep the workflow informative: individual failures are recorded, but
          # the workflow itself succeeds so a dead upstream source cannot block builds.

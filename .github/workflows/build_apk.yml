name: Build Wirdi Test APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up runner disk space (remove unused preinstalled toolchains)
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          echo "Disk space after cleanup:"
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        # DETERMINISM FIX (production hardening audit): "channel: stable"
        # with no version pin means every CI run can silently pick up a
        # DIFFERENT Flutter release (and therefore different bundled Dart
        # SDK, different default Android compileSdk/targetSdk defaults,
        # different plugin compatibility) than the run before it -- the
        # exact opposite of a reproducible build. Pinning an explicit
        # version makes every build use the identical toolchain until
        # this line is deliberately changed.
        # NOTE: pick the Flutter version you have most recently verified
        # actually builds this app successfully, and update this pin
        # deliberately (in its own commit) whenever you intentionally
        # upgrade -- never let it drift silently.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Use a STABLE debug keystore (GitHub Secret preferred, committed file as fallback)
        id: keystore_setup
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Using debug.keystore from the DEBUG_KEYSTORE_BASE64 GitHub Secret (most robust source)."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          elif [ -f "debug.keystore" ]; then
            echo "Using debug.keystore committed in the repo root."
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "::error::No debug.keystore found (no DEBUG_KEYSTORE_BASE64 secret and no committed debug.keystore)."
            echo "::error::Refusing to silently generate a random one -- see LOCAL_DEV_SETUP.md."
            exit 1
          fi

          echo ""
          echo "===== DEBUG keystore fingerprint actually used to sign THIS build ====="
          echo "(This is the DEBUG certificate. It is DIFFERENT from the RELEASE keystore"
          echo " used for the Play Store build, and DIFFERENT again from the Google Play"
          echo " App Signing certificate Google re-signs your release AAB with. Each of"
          echo " the three needs its OWN SHA-1 registered in Firebase separately.)"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"
          SHA1=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" | sed "s/.*SHA1: //")
          SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:" | sed "s/.*SHA256: //")
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "=========================================================================="

          cp ~/.android/debug.keystore debug.keystore



      - name: Generate Android platform folder
        run: flutter create --platforms=android --org com.wirdi --project-name wirdi .

      - name: "Tune Gradle/JVM memory for CI (fix: Gradle daemon disappearing mid-build)"
        run: |
          # BUILD FIX: the previous CI run's log showed
          #   "The message received from the daemon indicates that the
          #    daemon has disappeared."
          # right after a 24+ minute `bundleRelease` Gradle task, which
          # then exited with code 143 (SIGTERM) and GitHub Actions reported
          # "The operation was canceled." This specific combination is the
          # classic signature of the Gradle daemon's JVM being OOM-killed
          # by the Linux kernel -- NOT a real hang, a timeout, or anyone
          # manually cancelling the run. GitHub's standard ubuntu-latest
          # runners only have ~7 GB RAM shared between the OS, the Android
          # SDK tooling, the Kotlin daemon, AND the Gradle daemon's JVM
          # heap -- R8 full-mode minification for a release AAB on an app
          # this size (Firebase, Google Sign-In, several native plugins)
          # is memory-hungry enough to exceed that, especially once a
          # persistent Gradle daemon has already accumulated memory across
          # the earlier debug build in the same job.
          #
          # Fix, following Gradle's own published CI guidance (disable the
          # daemon in CI) plus an explicit, conservative heap cap so the
          # JVM itself asks the OS for a bounded, predictable amount of
          # memory instead of growing until something gets killed:
          #   - org.gradle.daemon=false   -> every `flutter build ...`
          #     invocation gets a fresh, short-lived JVM that exits
          #     cleanly afterwards. Slightly slower per-invocation
          #     startup, but there is no long-lived daemon process left
          #     to vanish, and no memory carried over between the debug
          #     and release builds later in this same job.
          #   - org.gradle.jvmargs -Xmx3072m -XX:MaxMetaspaceSize=1g ->
          #     caps the heap well under the runner's ~7 GB total, leaving
          #     headroom for the OS, AAPT2, D8/R8, and the Kotlin daemon
          #     running alongside it.
          #   - org.gradle.workers.max=2 -> limits parallel Gradle workers
          #     (each with its own heap slice) competing for that same
          #     capped memory at once.
          # Appended (not replacing the file) so Flutter's own template
          # defaults stay as a base; Java .properties semantics mean a
          # key repeated later in the same file wins, so these override
          # the template's own org.gradle.jvmargs line if present.
          {
            echo ""
            echo "# --- CI memory tuning (appended by workflow) ---"
            echo "org.gradle.daemon=false"
            echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
          } >> android/gradle.properties
          echo "----- Resulting android/gradle.properties -----"
          cat android/gradle.properties

      - name: Patch AndroidManifest.xml
        run: |
          python3 patch_manifest.py

      - name: Patch MainActivity for audio_service media notification
        run: |
          python3 patch_main_activity.py
          echo "----- Resulting MainActivity.kt -----"
          find android/app/src/main/kotlin -name MainActivity.kt -exec cat {} \;
          echo "--------------------------------------"

      - name: Create network_security_config.xml
        run: |
          mkdir -p android/app/src/main/res/xml
          cp network_security_config.xml android/app/src/main/res/xml/network_security_config.xml

      - name: Install real Adhan audio as a notification sound resource
        run: |
          mkdir -p android/app/src/main/res/raw
          cp adhan_sound.mp3 android/app/src/main/res/raw/adhan_sound.mp3

      - name: Install Android resource overrides (keep.xml for R8 + monochrome notification icon)
        run: |
          # android/ is git-ignored (regenerated by CI), so anything new that must
          # end up inside it lives in android_overrides/ and is copied here.
          mkdir -p android/app/src/main/res
          cp -r android_overrides/res/. android/app/src/main/res/
          ls -R android/app/src/main/res/raw android/app/src/main/res/drawable

      - name: Install Android Kotlin source overrides (WirdiWidgetProvider)
        run: |
          # BUILD FIX: patch_manifest.py declares
          #   <receiver android:name="com.wirdi.wirdi.WirdiWidgetProvider" ...>
          # but nothing ever copied the matching
          # android_overrides/kotlin/com/wirdi/wirdi/WirdiWidgetProvider.kt
          # into the generated android/app/src/main/kotlin/ tree -- so the
          # class the manifest points at never actually existed in the
          # build. A plain `flutter build apk --debug` doesn't notice (the
          # manifest merger doesn't verify component classes exist, and
          # debug builds skip R8), so this looked fine for a while. But
          # `flutter build appbundle --release` / `flutter build apk
          # --release` run R8, and R8 auto-generates keep rules for every
          # manifest-declared component (activities/services/receivers) --
          # it then fails with a hard "Missing class
          # com.wirdi.wirdi.WirdiWidgetProvider" error once it reaches
          # that reference. That happens late in the Gradle run (after
          # dependency resolution, Kotlin compilation and dexing all
          # already succeeded), which is exactly why this looks like the
          # build "hangs for a long time and then fails" -- it isn't
          # hanging, it's doing several real minutes of work before
          # failing at the minification step. Copying the Kotlin source
          # the same way android_overrides/res/ is copied above fixes it.
          mkdir -p android/app/src/main/kotlin
          cp -r android_overrides/kotlin/. android/app/src/main/kotlin/
          find android/app/src/main/kotlin -name WirdiWidgetProvider.kt -exec echo "Installed: {}" \;

      - name: Patch Android Gradle for core library desugaring
        run: |
          python3 patch_gradle.py


      - name: Setup Firebase (google-services.json + Gradle plugin)
        run: |
          # Copy google-services.json to android/app/
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          echo "google-services.json copied"

          # Patch build.gradle.kts to apply google-services plugin
          python3 - <<'PY'
          from pathlib import Path

          # Classic buildscript-classpath + apply(plugin=...) style instead of
          # the newer plugins-DSL id(...) style -- this works regardless of
          # whether this Flutter version's template declares plugins via
          # android/build.gradle.kts or android/settings.gradle.kts, since it
          # never needs to find/edit an existing plugins {} block.
          app_gradle = Path("android/app/build.gradle.kts")
          if app_gradle.exists():
              text = app_gradle.read_text()
              if 'com.google.gms.google-services' not in text:
                  text = text.rstrip() + '\n\napply(plugin = "com.google.gms.google-services")\n'
                  app_gradle.write_text(text)
                  print("Applied google-services plugin to app build.gradle.kts")

          root_gradle = Path("android/build.gradle.kts")
          if root_gradle.exists():
              text = root_gradle.read_text()
              if 'com.google.gms:google-services' not in text:
                  if 'buildscript' in text and 'dependencies' in text:
                      text = text.replace(
                          'dependencies {',
                          'dependencies {\n        classpath("com.google.gms:google-services:4.4.2")',
                          1,
                      )
                  else:
                      text = (
                          'buildscript {\n'
                          '    repositories {\n'
                          '        google()\n'
                          '        mavenCentral()\n'
                          '    }\n'
                          '    dependencies {\n'
                          '        classpath("com.google.gms:google-services:4.4.2")\n'
                          '    }\n'
                          '}\n\n'
                      ) + text
                  root_gradle.write_text(text)
                  print("Added google-services classpath to root build.gradle.kts")
          else:
              print("WARNING: android/build.gradle.kts not found -- classpath NOT added")
          PY

      - name: HARD GATE -- verify Google Sign-In configuration before building (DEBUG cert)
        run: |
          python3 scripts/verify_google_signin_config.py \
            --google-services google-services.json \
            --auth-service lib/core/services/auth_service.dart \
            --package com.wirdi.wirdi \
            --firebase-project wirdi-cb813 \
            --build-type debug \
            --keystore-sha1 "${{ steps.keystore_setup.outputs.sha1 }}" \
            --keystore-sha256 "${{ steps.keystore_setup.outputs.sha256 }}"
          # NOTE: PASS here only proves the DEBUG certificate matches Firebase.
          # It does NOT prove Google Sign-In works at runtime, and it says
          # NOTHING about the separate RELEASE or Google Play App Signing
          # certificates -- those need their own SHA-1 registered in Firebase
          # and are not validated by this step. See RELEASE_SIGNING_SETUP.md.



      - name: Set app name in launcher
        run: |
          mkdir -p android/app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <string name="app_name">Wirdi</string>' '</resources>' > android/app/src/main/res/values/strings.xml

      # DETERMINISM FIX (production hardening audit): this used to force-clear
      # the pub cache AND delete pubspec.lock on every single run, which
      # guarantees `flutter pub get` re-resolves every dependency's
      # version from scratch against whatever is newest on pub.dev that
      # day -- meaning two builds of the EXACT SAME commit, on different
      # days, could legitimately end up with different transitive
      # dependency versions. A committed pubspec.lock is the whole point
      # of Dart/Flutter's dependency locking -- deleting it defeats it
      # entirely. If pubspec.lock is not yet committed to this repo, run
      # `flutter pub get` locally once, commit the resulting
      # pubspec.lock, and keep it committed going forward (regenerate
      # and re-commit it deliberately, in its own commit, when you
      # intentionally want to update dependencies).
      - name: Install dependencies
        run: flutter pub get

      - name: Upload pubspec.lock (commit it to the repo root once for reproducible builds)
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock-COMMIT-THIS-TO-REPO-ROOT
          retention-days: 3
          path: pubspec.lock
          if-no-files-found: warn

      - name: Show Dependencies
        run: flutter pub deps

      - name: Analyze
        run: flutter analyze

      # Non-blocking on purpose until the first green run: remove the
      # continue-on-error line afterwards to make unit tests a hard gate.
      - name: Unit tests
        continue-on-error: true
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: HARD GATE #2 -- verify the ACTUAL built APK's certificate (not just the keystore file)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner | sort -V | tail -1)
          echo "Using apksigner at: $APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | tee apksigner_output.txt
          # v95 FIX: the original grep pattern "Signer #1 certificate SHA-1"
          # never matched this apksigner version's real output, which
          # instead prints lines like "V2 Signer: certificate SHA-1
          # digest: <hex>" (no colons, lowercase, different label
          # entirely). That caused REAL_SHA1 to always end up empty,
          # making this gate report a false mismatch even when the
          # actual signing certificate was already correct. Extract the
          # hex digest from ANY line containing "certificate SHA-1
          # digest:" instead of depending on the exact signer-scheme
          # label prefix (V1/V2/V3/Signer #1/etc, which varies by
          # apksigner version and signature scheme).
          REAL_SHA1=$(grep -oE "certificate SHA-1 digest: *[0-9a-fA-F:]+" apksigner_output.txt | head -1 | sed "s/.*digest: *//" | tr -d ':' | tr 'a-f' 'A-F')
          EXPECTED_SHA1=$(echo "${{ steps.keystore_setup.outputs.sha1 }}" | tr -d ':' | tr 'a-f' 'A-F')
          echo "Real APK signing SHA-1 (no colons): $REAL_SHA1"
          echo "Expected (from debug.keystore file): $EXPECTED_SHA1"
          if [ -z "$REAL_SHA1" ]; then
            echo "::error::Could not extract a SHA-1 digest from apksigner's output at all -- the output format changed again or verification itself failed. Treating this as a failure rather than silently skipping the check. Raw output:"
            cat apksigner_output.txt
            exit 1
          fi
          if [ "$REAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::The ACTUAL built APK is signed with a DIFFERENT certificate than the debug.keystore file we copied in! This is the exact bug that caused Google Sign-In to fail for months. Failing the build instead of shipping a broken APK."
            exit 1
          fi
          echo "CONFIRMED: the built APK's real signing certificate matches the intended debug.keystore."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-debug-apk
          retention-days: 3
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Check RELEASE signing secrets (skips release build gracefully if not configured yet -- never fails the job for this)
        id: release_secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::warning::Release signing secrets are not configured yet -- skipping the RELEASE build steps only. The debug APK above is unaffected. See RELEASE_SIGNING_SETUP.md in the repo root to enable release builds."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > key.properties << EOF
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyPassword=$RELEASE_KEY_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          storeFile=release.keystore
          EOF
          echo "Release keystore decoded from secret. Fingerprint shown below for diagnostics only (not a secret):"
          keytool -list -v -keystore release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | grep -E "SHA1:|SHA256:"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Wire RELEASE signing into build.gradle.kts (Flutter's template signs release with the DEBUG key)
        if: steps.release_secrets.outputs.present == 'true'
        run: python3 patch_release_signing.py

      - name: Build RELEASE App Bundle (for Play Store)
        if: steps.release_secrets.outputs.present == 'true'
        run: flutter build appbundle --release --no-tree-shake-icons --verbose

      - name: Build RELEASE APK (for direct testing)
        if: steps.release_secrets.outputs.present == 'true'
        run: flutter build apk --release --no-tree-shake-icons

      - name: Print the MERGED release manifest (permissions/features that actually ship)
        if: steps.release_secrets.outputs.present == 'true'
        run: |
          M=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Merged manifest: $M"
          grep -E "uses-permission|uses-feature|<service|<receiver" "$M" || true

      - name: HARD GATE #3 -- verify the ACTUAL built RELEASE APK's certificate matches the release keystore
        if: steps.release_secrets.outputs.present == 'true'
        run: |
          # Same class of bug HARD GATE #2 catches for the debug build,
          # but for release: never trust that "we fed Gradle the release
          # keystore" is the same thing as "the artifact Gradle actually
          # produced is signed with it". Extract the REAL certificate
          # from the built release APK and compare against the release
          # keystore's own fingerprint -- fail the build loudly on any
          # mismatch instead of silently shipping a wrongly-signed
          # artifact (which would show up as Google Sign-In or app
          # updates breaking for users, discovered only after release).
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner | sort -V | tail -1)
          echo "Using apksigner at: $APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee release_apksigner_output.txt
          REAL_SHA1=$(grep -oE "certificate SHA-1 digest: *[0-9a-fA-F:]+" release_apksigner_output.txt | head -1 | sed "s/.*digest: *//" | tr -d ':' | tr 'a-f' 'A-F')
          EXPECTED_SHA1=$(keytool -list -v -keystore release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | grep "SHA1:" | sed "s/.*SHA1: //" | tr -d ':' | tr 'a-f' 'A-F')
          echo "Real RELEASE APK signing SHA-1 (no colons): $REAL_SHA1"
          echo "Expected (from release.keystore file): $EXPECTED_SHA1"
          if [ -z "$REAL_SHA1" ]; then
            echo "::error::Could not extract a SHA-1 digest from apksigner's output for the release APK. Failing rather than silently skipping this check."
            cat release_apksigner_output.txt
            exit 1
          fi
          if [ "$REAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::The ACTUAL built RELEASE APK is signed with a DIFFERENT certificate than release.keystore! This would break Google Sign-In and/or app updates for real users. Failing the build instead of shipping a mis-signed artifact."
            exit 1
          fi
          echo "CONFIRMED: the built RELEASE APK's real signing certificate matches release.keystore (the upload key)."

          # Same check on the AAB -- this is the file that actually goes to Google Play.
          AAB_SHA1=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep "SHA1:" | head -1 | sed "s/.*SHA1: *//" | tr -d ':' | tr 'a-f' 'A-F')
          echo "Release AAB signing SHA-1 (no colons): $AAB_SHA1"
          if [ -z "$AAB_SHA1" ] || [ "$AAB_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::The release AAB is NOT signed with release.keystore (Google Play would reject it, or it would be debug-signed)."
            exit 1
          fi
          echo "CONFIRMED: the release AAB is signed with the upload key."
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

      - name: Upload release AAB (upload this exact file to Google Play Console)
        if: steps.release_secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-release-aab-for-play-store
          retention-days: 3
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload release APK (for testing the real release build directly on a device)
        if: steps.release_secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-release-apk-for-testing
          retention-days: 3
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
